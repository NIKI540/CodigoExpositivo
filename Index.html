<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tabla de Censo y Gráfica</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
<!-- En esta seccion direcionan la pagina ejemplo como vivimos.html-->
  <nav class="menu">
    <a href="Index.html">Cuántos somos</a>
    <a href="Donde-Estamos.html">Dónde estamos</a>
    <a href="Como-Vivimos.html">Cómo vivimos</a>
  </nav>

  <div class="contenedor">
    <!-- En esta seccion modifican la tabla -->
    <table>
      <tr>
        <!-- Se usa colspan="4" es para combinar columnas -->
        <td class="header" colspan="4">Total de personas censadas</td>
        <td id="totalCensados"></td>
      </tr>
      <tr>
        <th>VARIABLES</th>
        <th>ETIQUETA</th>
        <th>FRECUENCIA</th>
        <th>FRECUENCIA PORCENTUAL</th>
        <th>LLENAR</th>
      </tr>
      <tr>
        <!-- Se usa rowspan="2" es para combinar filas -->
        <td rowspan="2">GENERO</td>
        <td>Hombre</td>
        <td class="frecuencia"></td>
        <td class="porcentual"></td>
        <td class="llenar"></td>
      </tr>
      <tr>
        <td>Mujer</td>
        <td class="frecuencia"></td>
        <td class="porcentual"></td>
        <td class="llenar"></td>
      </tr>
      <tr>
        <td rowspan="3">EDADES HOMBRES</td>
        <td>0 - 14</td>
        <td class="frecuencia"></td>
        <td class="porcentual"></td>
        <td class="llenar"></td>
      </tr>
      <tr>
        <td>15 - 65</td>
        <td class="frecuencia"></td>
        <td class="porcentual"></td>
        <td class="llenar"></td>
      </tr>
      <tr>
        <td>&gt;= 65</td>
        <td class="frecuencia"></td>
        <td class="porcentual"></td>
        <td class="llenar"></td>
      </tr>
      <tr>
        <td rowspan="3">EDADES MUJERES</td>
        <td>0 - 14</td>
        <td class="frecuencia"></td>
        <td class="porcentual"></td>
        <td class="llenar"></td>
      </tr>
      <tr>
        <td>15 - 65</td>
        <td class="frecuencia"></td>
        <td class="porcentual"></td>
        <td class="llenar"></td>
      </tr>
      <tr>
        <td>&gt;= 65</td>
        <td class="frecuencia"></td>
        <td class="porcentual"></td>
        <td class="llenar"></td>
      </tr>
    </table>
    <!-- En esta seccion importa la grafica-->
    <canvas id="graficaPorcentual" width="600" height="300"></canvas>
  </div>
  <!-- En esta seccion importa los datos de JavaScript-->
  <script src="cuantos-somos.js"></script>
</body>
</html>
